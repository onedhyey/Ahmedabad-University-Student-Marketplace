<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var target = window;
        var desc = null;
        while (target && !desc) {
          desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc) {
            target = Object.getPrototypeOf(target);
          }
        }
        if (desc && desc.get && !desc.set) {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () { return currentFetch; },
            set: function (val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // Ignore
      }
    })();
  </script>
  <title>AUSM — Ahmedabad University Student Marketplace</title>
  <!-- Web App & PWA Settings -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="application-name" content="AUSM" />
  <meta name="apple-mobile-web-app-title" content="AUSM" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#1B3A5C" />

  <!-- Favicon links for Google Search Bot & Browsers -->
  <!-- Google Search has limited/inconsistent support for SVG favicons, so
         PNG is listed first as the primary icon; SVG remains for modern
         browsers that render it in the tab bar. -->
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Apple/iOS does not support SVG for touch icons at all, so this must be a PNG -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AUSM — Ahmedabad University Student Marketplace" />
  <meta property="og:description"
    content="Sell it. Find it. Campus only. Buy & sell books, cycles, and electronics directly with fellow AU students." />
  <meta property="og:image" content="https://ausm.online/favicon-96x96.png" />
  <meta property="og:site_name" content="AUSM" />

  <!-- Google Fonts: Plus Jakarta Sans & Caveat -->
